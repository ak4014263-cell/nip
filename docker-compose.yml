version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: swiply-postgres
    environment:
      POSTGRES_USER: swiply
      POSTGRES_PASSWORD: swiply123
      POSTGRES_DB: swiply
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swiply-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiply"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: swiply-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - swiply-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API Gateway (Python script)
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: swiply-gateway
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  # All microservices use same base image pattern
  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: auth
        PORT: 8001
    container_name: swiply-auth
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  profile:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: profile
        PORT: 8004
    container_name: swiply-profile
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  job:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: job
        PORT: 8003
    container_name: swiply-job
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  credential:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: credential
        PORT: 8009
    container_name: swiply-credential
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
      - ENCRYPTION_KEY=your-32-byte-encryption-key-here
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  email:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: email
        PORT: 8007
    container_name: swiply-email
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  automation:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: automation
        PORT: 8006
    container_name: swiply-automation
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
      - HEADLESS=true
      - REDIS_HOST=redis
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: ai
        PORT: 8010
    container_name: swiply-ai
    environment:
      - OPENAI_API_KEY=sk-your-key-here
    ports:
      - "8010:8010"
    networks:
      - swiply-network
    restart: unless-stopped

  # WTTJ Firefox Automation (with screenshots)
  wttj:
    build:
      context: .
      dockerfile: Dockerfile.wttj
    container_name: swiply-wttj
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
      - REDIS_URL=redis://redis:6379/0
      - HEADLESS=false
    ports:
      - "8012:8012"
    volumes:
      - ./screenshots:/app/screenshots
      - ./firefox_profile:/app/firefox_profile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped
    shm_size: '2gb'

  wttj_scraper:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: wttj_scraper
        PORT: 8013
    container_name: swiply-wttj-scraper
    environment:
      - DATABASE_URL=postgresql://swiply:swiply123@postgres:5432/swiply
    ports:
      - "8013:8013"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiply-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - swiply-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  swiply-network:
    driver: bridge
